g="en" href="https://toolfavor.com/contact.html"><link rel="alternate" hreflang="ja" href="https://toolfavor.com/ja/contact.html"><link rel="alternate" hreflang="x-default" href="https://toolfavor.com/contact.html"><!-- /locale-links --><style>.locale-switch{display:flex;justify-content:center;gap:14px;padding:10px 16px;background:#fff;font:13px/1.5 system-ui,sans-serif;border-bottom:1px solid #dfe3ee}.locale-switch a{color:#6548d6}.locale-switch [aria-current]{font-weight:750;text-decoration:underline}html[lang=ja] body{font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}html[lang=ja] h1{line-height:1.35;letter-spacing:-.025em}html[lang=ja] .nav{height:auto;min-height:68px;flex-wrap:wrap;padding-block:12px}html[lang=ja] .links{flex-wrap:wrap}html[lang=ja] p{overflow-wrap:anywhere}</style></head><body><!-- language-nav --><nav aria-label="Language" class="locale-switch"><a href="/contact.html" lang="en">English</a><a href="/ja/contact.html" lang="ja" aria-current="page">日本語</a></nav><!-- /language-nav --><header><div class="wrap nav"><a class="brand" href="/ja/"><img src="/assets/toolfavor-mark.svg" width="30" height="30" alt="">ToolFavor</a><a href="/ja/creators/1/">制作者のポートフォリオ →</a></div></header><main class="wrap"><section class="hero"><p class="eyebrow">お問い合わせ・ご意見</p><h1>ご意見や修正のご連絡はこちらへ</h1><p class="lead">リンク切れ、紹介文の修正、共同制作、お仕事のご相談などを受け付けています。</p></section><section class="card"><h2>ToolFavorに連絡する</h2><p class="note">入力内容を入れたメール作成画面が開きます。このフォームからサーバーに情報は送信されません。機密情報は入力しないでください。</p><form id="feedback"><label for="topic">お問い合わせの種類</label><select id="topic"><option>サイトへのご意見</option><option>ツール情報の修正</option><option>共同制作のご相談</option><option>採用・制作実績について</option><option>その他</option></select><label for="name">お名前（任意）</label><input id="name" maxlength="100" autocomplete="name"><label for="message">お問い合わせ内容</label><textarea id="message" required maxlength="5000" placeholder="Tell us what we can improve..."></textarea><button type="submit">メールアプリを開く →</button></form><p class="note">メールアプリを使わない場合はこちらへ：<a href="mailto:hello@toolfavor.com?subject=ToolFavor%20feedback">hello@toolfavor.com</a>.</p></section></main><footer><div class="wrap">© ToolFavor · <a href="/ja/">ホーム</a> · <a href="/ja/developers.html">開発者の方へ</a></div></footer><script>document.getElementById("feedback").addEventListener("submit",function(e){e.preventDefault();const topic=document.getElementById("topic").value,name=document.getElementById("name").value.trim(),msg=document.getElementById("message").value.trim();if(!msg)return;const body=(name?"From: "+name+"\n\n":"")+msg;location.href="mailto:hello@toolfavor.com?subject="+encodeURIComponent("ToolFavor: "+topic)+"&body="+encodeURIComponent(body)})</script></body></html>
