<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Tool detail responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ebf3;font:14px system-ui;color:#202535}header{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:white}label{display:flex;gap:6px;align-items:center}select{padding:8px;border:1px solid #ccd0df;border-radius:6px}main{padding:16px;display:flex;justify-content:center}iframe{border:1px solid #ccd0df;background:white;width:375px;height:812px;box-shadow:0 8px 30px #26334c24}</style><header><strong>Responsive review</strong><label>Page <select id="tool"></select></label><label>Language <select id="locale"><option value="zh-cn">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><label>Width <select id="width"><option>375</option><option>320</option><option>768</option><option>1280</option></select></label><span id="status"></span></header><main><iframe id="preview" title="Product page preview"></iframe></main><script>const slugs=['videotoprompt','videoinprompt','promptvv','reprompt-video-to-prompt','videotoprompt-app'];const byId=id=>document.getElementById(id);slugs.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;byId('tool').append(o)});function render(){let lang=byId('locale').value;byId('preview').src=(lang==='en'?'':'/'+lang)+'/tools/'+byId('tool').value;byId('preview').style.width=byId('width').value+'px';byId('status').textContent=byId('width').value+'px viewport'}['tool','locale','width'].forEach(id=>byId(id).addEventListener('change',render));render();</script></html>
